<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <!-- <script src="script.js" defer></script> -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Rock Paper Scissors</h1>
<h3>Select a move below</h3>
<div class="rps-move-container">
    <button class="rps-move-button">Rock</button>
    <button class="rps-move-button">Paper</button>
    <button class="rps-move-button">Scissors</button>
</div>
<div>
    <p class="human-selection">You selected: </p>
    <p class="computer-selection">Computer selected: </p>
</div>
<div class="score-container">
    <h3>Score</h3>
    <p class="human-score">Player: </p>
    <p class="computer-score">Computer: </p>
    <p class="ties">Ties: </p>
</div>

    
</body>
</html>
