<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Rock Paper Scissors</h1>
<h3>Select a move below</h3>
<div class="rps-move-container">
    <button class="rps-move-button">Rock</button>
    <button class="rps-move-button">Paper</button>
    <button class="rps-move-button">Scissors</button>
</div>

<div>
    <p class="human-selection">Selected move: <span id="human-selection-detail"></span></p>
    <p class="computer-selection">Computer selected: <span id="computer-selection-detail"></span> </p>
</div>


<div class="score-container">
    <h3>Score</h3>
    <p class="human-score">Human: <span id="human-score-detail"></span> </p>
    <p class="computer-score">Computer: <span id="computer-score-detail"></span> </p>
    <p class="ties">Ties: <span id="ties-detail"></span> </p>
</div>

    
</body>
</html>
